services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: patient_order
      POSTGRES_USER: patient_order
      POSTGRES_PASSWORD: patient_order
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_order -d patient_order"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://patient_order:${POSTGRES_PASSWORD:-patient_order}@postgres:5432/patient_order
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["4000:4000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  postgres-data:
